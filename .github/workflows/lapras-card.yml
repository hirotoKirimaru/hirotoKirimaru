name: LAPRAS Card

on:
  workflow_dispatch:
#   schedule:
#     - cron: "0 0 * * *"

jobs:
  update-card:
    name: LAPRAS Card
    runs-on: ubuntu-26.04-arm
    steps:
      # 第三者の action はブランチ（@main）ではなくコミットで固定する（中身が書き換わっても影響を受けない）
      - uses: kawamataryo/lapras-card-readme@ade0e924c0ab08745fad19435907812a830d004f # main（2026-11-18 時点）
        with:
          SHARE_ID: 'kirimaru'
          # 以下オプション
          # https://lapras-card-generator.vercel.app でカスタマイズしたデザインを設定可能
          # ICON_FIRST: '#030E21'
          # ICON_SECOND: '#1688BF'
          # BACKGROUND_FIRST: '#020E27'
          # BACKGROUND_SECOND: '#0E5593'
          # LANG: 'ja'
