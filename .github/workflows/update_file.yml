# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  # workflow_dispatch に branches は書けない（以前は書いてあったが無視されていた）
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron:  '0 10 * * 0'

# main.py が README.md を commit して push する
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10 # job全体

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.15"
    - name: Install dependencies
      run: uv sync --locked
    - name: update
      run: uv run python main.py
      # pull_request では README.md の更新までを確かめ、commit / push はしない
      env:
        DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
